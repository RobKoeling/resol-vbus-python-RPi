<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RESOL Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- PWA Manifest and Meta Tags -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#ef4444">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Resol Solar">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="brand">RESOL</div>
        <nav class="nav">
          <a class="nav-item" href="{{ url_for('index') }}">Current Status</a>
          <a class="nav-item" href="{{ url_for('hour') }}">Last Hour</a>
          <a class="nav-item" href="{{ url_for('day') }}">Day</a>
          <a class="nav-item" href="{{ url_for('week') }}">Week</a>
          <a class="nav-item" href="{{ url_for('month') }}">Month</a>
        </nav>
      </aside>
      <main class="main">
        {% block content %}{% endblock %}
      </main>
    </div>
    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
      <a class="mobile-nav-item" href="{{ url_for('index') }}">
        <span class="icon">🏠</span>
        <span>Status</span>
      </a>
      <a class="mobile-nav-item" href="{{ url_for('shower') }}">
        <span class="icon">🚿</span>
        <span>Shower</span>
      </a>
      <a class="mobile-nav-item" href="{{ url_for('hour') }}">
        <span class="icon">📊</span>
        <span>Hour</span>
      </a>
      <a class="mobile-nav-item" href="{{ url_for('day') }}">
        <span class="icon">📈</span>
        <span>Day</span>
      </a>
      <a class="mobile-nav-item" href="{{ url_for('week') }}">
        <span class="icon">📅</span>
        <span>Week</span>
      </a>
      <a class="mobile-nav-item" href="{{ url_for('month') }}">
        <span class="icon">📆</span>
        <span>Month</span>
      </a>
    </nav>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/service-worker.js')
            .then(registration => {
              console.log('Service Worker registered:', registration.scope);
            })
            .catch(error => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
