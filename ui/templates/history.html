{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="panel-header">
    <h2>{{ title }}</h2>
  </div>
  <div class="chart-container">
    <canvas id="historyChart"></canvas>
  </div>
  <div class="chart-legend">
    <span class="legend-item"><span class="legend-color" style="background:#ef4444"></span> Solar Panel</span>
    <span class="legend-item"><span class="legend-color" style="background:#3b82f6"></span> Tank (Lower)</span>
    <span class="legend-item"><span class="legend-color" style="background:#22c55e"></span> Tank (Upper)</span>
    <span class="legend-item"><span class="legend-color" style="background:rgba(220,38,38,0.3)"></span> Pump %</span>
  </div>
</div>

<script>
const period = '{{ period }}';
const title = '{{ title }}';

async function loadChart() {
  const resp = await fetch('/api/history/' + period);
  const data = await resp.json();

  if (data.error) {
    document.querySelector('.chart-container').innerHTML = '<p>Error loading data: ' + data.error + '</p>';
    return;
  }

  if (!data.timestamps || data.timestamps.length === 0) {
    document.querySelector('.chart-container').innerHTML = '<p>No data available for ' + title.toLowerCase() + '.</p>';
    return;
  }

  // Format timestamps for display
  // For hour: show HH:MM, for day/week: show date + time
  const labels = data.timestamps.map(ts => {
    const d = new Date(ts.replace('Z', '+00:00'));
    if (period === 'hour') {
      return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    } else if (period === 'day') {
      return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    } else {
      return d.toLocaleDateString([], {month: 'short', day: 'numeric'}) + ' ' +
             d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }
  });

  const ctx = document.getElementById('historyChart').getContext('2d');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Solar Panel (°C)',
          data: data.temp1,
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          borderWidth: 2,
          tension: 0.3,
          yAxisID: 'y',
          pointRadius: period === 'hour' ? 2 : 1,
        },
        {
          label: 'Tank Lower (°C)',
          data: data.temp2,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          borderWidth: 2,
          tension: 0.3,
          yAxisID: 'y',
          pointRadius: period === 'hour' ? 2 : 1,
        },
        {
          label: 'Tank Upper (°C)',
          data: data.temp3,
          borderColor: '#22c55e',
          backgroundColor: 'rgba(34, 197, 94, 0.1)',
          borderWidth: 2,
          tension: 0.3,
          yAxisID: 'y',
          pointRadius: period === 'hour' ? 2 : 1,
        },
        {
          label: 'Pump %',
          data: data.pump1,
          type: 'bar',
          backgroundColor: 'rgba(220, 38, 38, 0.3)',
          borderColor: 'rgba(220, 38, 38, 0.6)',
          borderWidth: 1,
          yAxisID: 'y1',
          barPercentage: 1.0,
          categoryPercentage: 1.0,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false,
      },
      plugins: {
        legend: {
          display: false,
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              let label = context.dataset.label || '';
              if (context.parsed.y !== null) {
                if (label.includes('Pump')) {
                  label += ': ' + context.parsed.y + '%';
                } else {
                  label += ': ' + context.parsed.y.toFixed(1) + '°C';
                }
              }
              return label;
            }
          }
        }
      },
      scales: {
        x: {
          display: true,
          title: {
            display: true,
            text: 'Time'
          },
          ticks: {
            maxTicksLimit: period === 'week' ? 14 : 12
          }
        },
        y: {
          type: 'linear',
          display: true,
          position: 'left',
          title: {
            display: true,
            text: 'Temperature (°C)'
          },
          grid: {
            drawOnChartArea: true,
          }
        },
        y1: {
          type: 'linear',
          display: true,
          position: 'right',
          title: {
            display: true,
            text: 'Pump (%)'
          },
          min: 0,
          max: 100,
          grid: {
            drawOnChartArea: false,
          }
        }
      }
    }
  });
}

loadChart();
</script>
{% endblock %}
