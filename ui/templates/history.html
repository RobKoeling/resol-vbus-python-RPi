{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="panel-header">
    <h2>{{ title }}</h2>
  </div>
  <div class="chart-container">
    <canvas id="historyChart"></canvas>
  </div>
  <div class="chart-legend">
    <span class="legend-item"><span class="legend-color" style="background:#ef4444"></span> Solar Panel</span>
    <span class="legend-item"><span class="legend-color" style="background:#3b82f6"></span> Tank (Lower)</span>
    <span class="legend-item"><span class="legend-color" style="background:#22c55e"></span> Tank (Upper)</span>
    <span class="legend-item"><span class="legend-color" style="background:rgba(220,38,38,0.3)"></span> Pump %</span>
  </div>
</div>

<script>
const period = '{{ period }}';
const title = '{{ title }}';

async function loadChart() {
  const resp = await fetch('/api/history/' + period);
  const data = await resp.json();

  if (data.error) {
    document.querySelector('.chart-container').innerHTML = '<p>Error loading data: ' + data.error + '</p>';
    return;
  }

  if (!data.timestamps || data.timestamps.length === 0) {
    document.querySelector('.chart-container').innerHTML = '<p>No data available for ' + title.toLowerCase() + '.</p>';
    return;
  }

  // Convert timestamps to Date objects for time scale
  // Filter out null timestamps (gap markers) and create {x, y} data points
  // Mark points at 5-minute intervals for tooltips
  function makeDataset(timestamps, values) {
    const points = [];
    for (let i = 0; i < timestamps.length; i++) {
      if (timestamps[i] === null || values[i] === null) {
        points.push({x: null, y: null, showTooltip: false});
      } else {
        const date = new Date(timestamps[i].replace('Z', '+00:00'));
        // Show tooltip only if minutes are divisible by 5 (e.g., :00, :05, :10, :15, etc.)
        const showTooltip = date.getMinutes() % 5 === 0 && date.getSeconds() === 0;
        points.push({
          x: date,
          y: values[i],
          showTooltip: showTooltip
        });
      }
    }
    return points;
  }

  const ctx = document.getElementById('historyChart').getContext('2d');

  new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'Solar Panel (°C)',
          data: makeDataset(data.timestamps, data.temp1),
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          borderWidth: 2,
          tension: 0.3,
          yAxisID: 'y',
          pointRadius: period === 'hour' ? 2 : (period === 'month' ? 0 : 1),
          spanGaps: false,
        },
        {
          label: 'Tank Lower (°C)',
          data: makeDataset(data.timestamps, data.temp2),
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          borderWidth: 2,
          tension: 0.3,
          yAxisID: 'y',
          pointRadius: period === 'hour' ? 2 : (period === 'month' ? 0 : 1),
          spanGaps: false,
        },
        {
          label: 'Tank Upper (°C)',
          data: makeDataset(data.timestamps, data.temp3),
          borderColor: '#22c55e',
          backgroundColor: 'rgba(34, 197, 94, 0.1)',
          borderWidth: 2,
          tension: 0.3,
          yAxisID: 'y',
          pointRadius: period === 'hour' ? 2 : (period === 'month' ? 0 : 1),
          spanGaps: false,
        },
        {
          label: 'Pump %',
          data: makeDataset(data.timestamps, data.pump1),
          type: 'bar',
          backgroundColor: 'rgba(220, 38, 38, 0.3)',
          borderColor: 'rgba(220, 38, 38, 0.6)',
          borderWidth: 1,
          yAxisID: 'y1',
          barPercentage: 1.0,
          categoryPercentage: 1.0,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: true,
      },
      plugins: {
        legend: {
          display: false,
        },
        tooltip: {
          filter: function(tooltipItem) {
            // Only show tooltip if the data point has a valid y value and is marked for tooltip display (5-minute intervals)
            const dataPoint = tooltipItem.dataset.data[tooltipItem.dataIndex];
            return tooltipItem.parsed.y !== null && dataPoint.showTooltip === true;
          },
          callbacks: {
            label: function(context) {
              let label = context.dataset.label || '';
              if (context.parsed.y !== null) {
                if (label.includes('Pump')) {
                  label += ': ' + context.parsed.y + '%';
                } else {
                  label += ': ' + context.parsed.y.toFixed(1) + '°C';
                }
              }
              return label;
            }
          }
        }
      },
      scales: {
        x: {
          type: 'time',
          display: true,
          title: {
            display: true,
            text: 'Time'
          },
          time: {
            displayFormats: {
              hour: 'HH:mm',
              day: 'MMM d'
            },
            unit: (period === 'week' || period === 'month') ? 'day' : 'hour'
          },
          ticks: {
            maxTicksLimit: period === 'month' ? 10 : (period === 'week' ? 7 : 12)
          }
        },
        y: {
          type: 'linear',
          display: true,
          position: 'left',
          title: {
            display: true,
            text: 'Temperature (°C)'
          },
          grid: {
            drawOnChartArea: true,
          }
        },
        y1: {
          type: 'linear',
          display: true,
          position: 'right',
          title: {
            display: true,
            text: 'Pump (%)'
          },
          min: 0,
          max: 100,
          grid: {
            drawOnChartArea: false,
          }
        }
      }
    }
  });
}

loadChart();
</script>
{% endblock %}
